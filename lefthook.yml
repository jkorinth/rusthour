# Local git hooks. Install once with `lefthook install`.
# CI runs the same checks; hooks just catch problems earlier.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    typos:
      run: typos {staged_files}
    taplo:
      glob: "*.toml"
      run: taplo fmt --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: scripts/check-commit-msg.sh {1}
