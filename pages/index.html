<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust Hour</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f4; --fg: #1b1b1b; --line: #c8c8c8; --link: #0b5cad; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #242424; --fg: #e8e8e8; --line: #444; --link: #8cc4ff; }
    }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
           font: 15px/1.4 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4em 1em;
             padding: 0.35em 1em; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 auto 0 0; font-size: 1em; }
    select { font: inherit; padding: 0.15em 0.3em; }
    a { color: var(--link); }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    iframe { flex: 1; width: 100%; border: 0; background: #1b1b1b; }
    #note { flex-basis: 100%; margin: 0; font-size: 0.9em; }
  </style>
</head>
<body>
  <header>
    <h1>Rust Hour</h1>
    <label>Version <select id="version"><option value="main">main (development)</option></select></label>
    <a id="open" href="main/">Open this version on its own</a>
    <p id="note" role="status" hidden></p>
  </header>
  <iframe id="frame" title="Rust Hour viewer" allow="fullscreen" allowfullscreen></iframe>
  <script>
    // Each version is a self-contained build in ./<id>/; nothing is shared between them.
    const select = document.getElementById("version");
    const open = document.getElementById("open");
    const frame = document.getElementById("frame");

    // The viewer's own parameters (e.g. ?map=bensheim-1km) travel with this page's URL.
    function viewerSearch(params) {
      const own = new URLSearchParams(params);
      own.delete("v");
      const search = own.toString();
      return search ? "?" + search : "";
    }

    function show(id) {
      select.value = id;
      open.href = frame.src = id + "/" + viewerSearch(location.search);
      const url = new URL(location);
      url.searchParams.set("v", id);
      history.replaceState(null, "", url);
    }

    frame.addEventListener("load", () => {
      // The viewer reloads itself to switch maps; keep this page's URL shareable.
      const inner = frame.contentWindow.location;
      const url = new URL(location);
      url.search = "?" + new URLSearchParams([["v", select.value], ...new URLSearchParams(inner.search)]);
      history.replaceState(null, "", url);
      open.href = inner.pathname + inner.search;
      // Hand keyboard focus to the viewer, unless the user is still picking a version.
      if (document.activeElement !== select) frame.focus();
    });
    select.addEventListener("change", () => show(select.value));

    const note = document.getElementById("note");
    function tell(text) {
      note.textContent = text;
      note.hidden = false;
    }

    fetch("versions.json")
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null)
      .then((list) => {
        if (list && list.length) {
          select.replaceChildren(...list.map((v) => new Option(v.label, v.id)));
        } else {
          tell("The list of released versions could not be loaded; only the development build is available. Reload to try again.");
        }
        // Only ids from versions.json become frame URLs.
        const wanted = new URLSearchParams(location.search).get("v");
        const ids = [...select.options].map((o) => o.value);
        if (wanted && !ids.includes(wanted) && list && list.length) {
          tell(`Version "${wanted}" is not available here; showing the development build instead.`);
        }
        show(ids.includes(wanted) ? wanted : "main");
      });
  </script>
</body>
</html>
