# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, no fix available; native-only (Linux) dependencies of eframe
  # (winit's Wayland decorations; AccessKit's AT-SPI bridge). On every eframe
  # update, re-run `cargo deny check advisories` without these (see
  # .github/dependabot.yml).
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit/sctk-adwaita; https://github.com/harfbuzz/ttf-parser/issues/217; remove when winit/sctk-adwaita moves to a ttf-parser replacement" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit_unix/zbus 5; https://github.com/z-galaxy/zbus/issues/2043; remove when eframe/accesskit moves to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit_unix/zbus 5; https://github.com/z-galaxy/zbus/issues/2043; remove when eframe/accesskit moves to zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit_unix/zbus 5; https://github.com/z-galaxy/zbus/issues/2043; remove when eframe/accesskit moves to zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# egui's bundled fonts (ADR-0003); their license texts ship in
# crates/rusthour-viz/licenses/.
exceptions = [{ crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] }]

[licenses.private]
# Workspace crates are `publish = false`; their own license is not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Dependency direction (AGENTS.md §6): only rusthour-api may depend on
  # rusthour-core. Frontends go through the API.
  { crate = "rusthour-core", wrappers = ["rusthour-api"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
