name: release-please

# Maintains a release PR from conventional commits. Merge it only when a
# milestone is complete (ROADMAP.md §4); merging tags the release.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Keep every release online: attach its web build so pages.yml can serve it.
  web-build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.0
      - name: Trunk build (relative URLs, valid at any path)
        working-directory: crates/rusthour-viz
        run: trunk build --release
      # Bundled in the zip, so each release keeps the maps it can read (ADR-0003).
      - name: Add the tag's maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/assets.py bundle data/assets.toml crates/rusthour-viz/dist/maps
      - name: Attach rusthour-web-<tag>.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd crates/rusthour-viz/dist && zip -qr "$RUNNER_TEMP/rusthour-web-$TAG.zip" .)
          gh release upload "$TAG" "$RUNNER_TEMP/rusthour-web-$TAG.zip" -R "$GITHUB_REPOSITORY"

  # Releases made with GITHUB_TOKEN don't trigger other workflows, so redeploy here.
  pages:
    needs: web-build
    permissions:
      contents: read
      pages: write
      id-token: write
    # actionlint rejects the `$/` self-repository syntax zizmor prefers.
    uses: ./.github/workflows/pages.yml # zizmor: ignore[self-repository]
