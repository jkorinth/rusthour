name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The `server` feature is native-only, so default features here.
      - run: cargo build --target wasm32-unknown-unknown -p rusthour-core -p rusthour-api -p rusthour-import -p rusthour-viz
      # ADR-0002: no OSM parser in the browser build, even once the viewer
      # depends on rusthour-import (only `cargo tree`'s "no match" passes).
      - name: No osmpbf in the rusthour-viz wasm32 tree
        run: |
          if out=$(cargo tree -p rusthour-viz --target wasm32-unknown-unknown -e normal -i osmpbf 2>&1); then
            echo "$out"
            echo "::error::osmpbf is in rusthour-viz's wasm32 dependency tree (ADR-0002)"
            exit 1
          fi
          grep -q "did not match any packages" <<<"$out" || { echo "$out"; exit 1; }
      - uses: taiki-e/install-action@v2
        with:
          # Pinned (Dependabot doesn't bump it); tool versions in Trunk.toml.
          tool: trunk@0.22.0
      - name: Web build (Trunk) and size report
        working-directory: crates/rusthour-viz
        run: |
          trunk build --release
          raw=$(cat dist/*.wasm | wc -c)
          gz=$(gzip -9 -c dist/*.wasm | wc -c)
          {
            echo '### Web build size (bytes)'
            echo '```'
            ls -l dist
            echo "wasm, gzip -9: $gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web build size::wasm $raw bytes, gzip -9 $gz bytes"

  deps:
    name: cargo-deny + cargo-shear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - run: cargo shear

  text-lint:
    name: typos + taplo + markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - run: taplo fmt --check
      - run: npx --yes markdownlint-cli2

  actions-lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - run: pipx run zizmor --offline .github/workflows

  scripts:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s scripts -p 'test_*.py' -v
