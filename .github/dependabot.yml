version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # On eframe updates, re-run `cargo deny check advisories` without the four
    # RUSTSEC ignores in deny.toml, and bump wasm_bindgen in
    # crates/rusthour-viz/Trunk.toml with wasm-bindgen.
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
