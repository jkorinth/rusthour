name: Bug / regression
description: Something broke or behaves wrongly. The fix must add one regression test.
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, scenario file, seed, and step count if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: found-by
    attributes:
      label: Found by
      options: [user trial, development, CI, other]
