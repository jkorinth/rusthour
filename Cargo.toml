[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Bumped by release-please (see release-please-config.json). Do not edit by hand.
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/jkorinth/rusthour"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
rusthour-core = { path = "crates/rusthour-core" }
rusthour-api = { path = "crates/rusthour-api" }
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: exact f64 parsing, so network JSON round-trips losslessly.
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Safe-code encoder and decoder only.
lz4_flex = { version = "0.14", default-features = false, features = [
  "alloc",
  "safe-decode",
  "safe-encode",
] }
sha2 = { version = "0.11", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented exceptions to `pedantic`:
# - Crate-prefixed type names (e.g. `network::NetworkId`) are idiomatic in this codebase.
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
debug = true
