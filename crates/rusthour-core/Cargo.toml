[package]
name = "rusthour-core"
description = "Rust Hour simulation core: deterministic, no I/O, wasm-compatible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rand_chacha.workspace = true

[dev-dependencies]
proptest.workspace = true

# Native only: dhat and criterion need std features wasm32 lacks (the wasm
# determinism job builds this crate's tests for wasm32-wasip1).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dhat.workspace = true
