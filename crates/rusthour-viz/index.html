<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Rust Hour</title>
  <!-- Trunk: build the viewer and ship the font license texts (ADR-0003). -->
  <link data-trunk rel="rust" data-bin="rusthour-viz">
  <link data-trunk rel="copy-dir" href="licenses">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #e0e0e0; }
    /* The app handles touch pan and pinch; the page itself must not move. */
    #rusthour_canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              padding: 2em; text-align: center; font: 18px sans-serif; }
  </style>
</head>
<body>
  <canvas id="rusthour_canvas"></canvas>
  <p id="status">Loading Rust Hour…</p>
  <noscript><p>Rust Hour needs JavaScript and WebAssembly.</p></noscript>
</body>
</html>
