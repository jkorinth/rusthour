<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Rust Hour</title>
  <!-- Trunk: build the viewer and ship the font license texts (ADR-0003). -->
  <!-- wasm-opt -Os: most of -Oz's size savings, with less risk of slowing the
       per-frame path; the ADR-0003 opt-level "z" experiment compares to this. -->
  <link data-trunk rel="rust" data-bin="rusthour-viz" data-wasm-opt="s">
  <link data-trunk rel="copy-dir" href="licenses">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #e0e0e0; }
    /* The app handles touch pan and pinch; the page itself must not move. */
    #rusthour_canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #status, #noscript { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              padding: 2em; text-align: center; font: 18px sans-serif; white-space: pre-line;
              background: #1b1b1b; overflow: auto; }
    /* Above #status, whose loading text never changes without JavaScript. */
    #noscript { z-index: 1; }
  </style>
</head>
<body>
  <canvas id="rusthour_canvas"></canvas>
  <div id="status">Loading Rust Hour…</div>
  <script>
    // Before the wasm runs, nothing else can report that it failed to download
    // or start (the viewer replaces this text itself once it runs).
    (function () {
      var status = document.getElementById("status");
      function fail(details) {
        if (status.textContent !== "Loading Rust Hour…") return;
        status.textContent = "Rust Hour could not be loaded. Check your connection and " +
          "reload the page. Rust Hour needs a current Firefox, Chrome, Edge or Safari " +
          "with WebAssembly enabled." + (details ? "\n\nDetails: " + details : "");
      }
      // Capture phase: a script that fails to download fires `error` on itself only.
      window.addEventListener("error", function (e) {
        var tag = e.target && e.target.tagName;
        if (tag === "SCRIPT" || tag === "LINK") {
          fail("");
        } else if (e.filename && e.filename.indexOf(location.origin) === 0) {
          // Only our own scripts: not images, nor browser extensions.
          fail(e.message);
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        fail(String(e.reason));
      });
      // Middle-button drag pans the map; don't let the browser start autoscroll.
      document.getElementById("rusthour_canvas").addEventListener("mousedown", function (e) {
        if (e.button === 1) e.preventDefault();
      });
    })();
  </script>
  <noscript><div id="noscript">Rust Hour needs JavaScript and WebAssembly. Turn on
    JavaScript, or try a current Firefox, Chrome, Edge or Safari.</div></noscript>
</body>
</html>
